# Nginx 反向代理配置
# 前端静态文件 + 后端 Tomcat 接口
#
# 放置位置：/etc/nginx/conf.d/febs.conf
# 重载：nginx -s reload

upstream febs_tomcat {
    server 127.0.0.1:8233;
    keepalive 32;
}

server {
    listen 80;
    server_name 81.68.239.216;

    # 前端打包产物目录（frontend/dist 的内容）
    root /myproject/bottled_water_sales_cos/frontend/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript application/json image/svg+xml;

    # 后端接口，反向代理到 Tomcat 的 /febs 上下文
    location /febs/ {
        proxy_pass http://febs_tomcat/febs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 与后端 spring.servlet.multipart.max-file-size 保持一致
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前后端同域部署时，上传图片的访问路径也走这里
    location /imagesWeb/ {
        proxy_pass http://febs_tomcat/febs/imagesWeb/;
        proxy_set_header Host $host;
    }

    # 前端为 history 模式路由，未匹配到的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

